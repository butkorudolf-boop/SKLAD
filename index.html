<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Sklad</title>
<style>
:root{--green:#3a3a3a;--bg:#000000;--card:#1e1e1e;--text:#f2f2f2;--muted:#b8b8b8;--line:#383838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
header{background:#000000;color:white;padding:22px 16px 20px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0005}
h1{font-size:24px;margin:0 0 4px}header p{margin:0;color:#c5d4eb;font-size:13px}main{max-width:850px;margin:auto;padding:14px}
input,select,button{font:inherit}#q{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 12px;background:var(--card);color:var(--text);font-size:16px;outline-color:#a0a0a0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}select{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px;color:var(--text);min-width:0}
.status{font-size:13px;color:var(--muted);margin:8px 2px 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px #00004}
.itemtitle{font-size:17px;font-weight:750;margin-bottom:8px;line-height:1.35}.part{font-size:13px;color:var(--muted);margin-bottom:10px}
.position{background:#111111;border:1px solid #444444;border-radius:10px;padding:10px 12px;margin:8px 0 10px}.position small{display:block;color:#bdbdbd;font-size:11px;font-weight:800;letter-spacing:.05em}.position strong{display:block;font-size:25px;color:#ffffff;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{background:#141414;border:1px solid #383838;border-radius:8px;padding:9px;min-width:0}.field small{display:block;color:var(--muted);font-size:11px}.field strong{font-size:15px;overflow-wrap:anywhere}
.btn{border:0;border-radius:10px;padding:10px 12px;background:var(--green);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#292929;color:#f2f2f2;border:1px solid #444444}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px 18px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}
.top-downloads{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.top-downloads .btn{flex:1 1 220px;min-height:44px;font-weight:750}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filebtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px}.filebtn input{display:none}
footer{padding:12px 16px 28px;text-align:center;font-size:12px;color:var(--muted)}
@media(min-width:600px){.filters{grid-template-columns:1.5fr 1fr}.card{padding:16px}.grid{grid-template-columns:repeat(3,1fr)}}

.checklists{margin:22px 0 16px}.section-title{font-size:19px;margin:0 0 5px}.section-note{font-size:13px;color:var(--muted);margin:0 0 12px}
.checklist{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}
.checklist summary{cursor:pointer;list-style:none;padding:14px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:10px}
.checklist summary::-webkit-details-marker{display:none}.checklist summary:after{content:"＋";font-size:18px;color:var(--muted)}.checklist[open] summary:after{content:"−"}
.progress{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;min-width:92px;text-align:right;flex-shrink:0;margin-left:auto}
.list-group-title{font-size:14px;font-weight:750;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.list-group-title:first-child{margin-top:8px}
.checklist-items{padding:0 10px 10px}.category-accordion{background:#111;border:1px solid #555;border-radius:14px;margin:12px 0;overflow:hidden}.category-accordion>summary{cursor:pointer;list-style:none;padding:18px 16px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#202020}.category-accordion>summary::-webkit-details-marker{display:none}.category-accordion>summary:after{content:"＋";font-size:22px;color:#ddd}.category-accordion[open]>summary:after{content:"−"}.category-content{padding:2px 12px 10px}.category-count{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;min-width:86px;text-align:right;margin-left:auto;flex-shrink:0}.category-content .checklist{margin:9px 0}.category-content .checklist summary{padding:13px}.check-item{display:flex;gap:11px;align-items:flex-start;padding:12px 4px;border-top:1px solid var(--line)}
.check-item input{width:22px;height:22px;accent-color:#d0d0d0;flex-shrink:0;margin:1px 0 0}
.check-item label{flex:1;min-width:0;cursor:pointer}.check-desc{font-weight:650;line-height:1.35}.check-meta{font-size:12px;color:var(--muted);margin-top:4px}.check-meta strong{display:inline-block;font-size:18px;font-weight:850;color:#fff;line-height:1.25;overflow-wrap:anywhere}.quantity-value{display:inline-block;margin:5px 0 0 6px;padding:3px 8px;border-radius:6px;background:#383838;color:#fff;font-size:18px;font-weight:850;line-height:1.25;vertical-align:middle}.check-item.done .check-desc{text-decoration:line-through;color:var(--muted)}
.check-actions{display:flex;justify-content:flex-end;padding:8px 4px 2px}
.export-menu{position:relative;min-width:250px;flex:1;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:5}
.export-menu>summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:10px}
.export-menu>summary::-webkit-details-marker{display:none}.export-menu>summary:after{content:"＋";color:var(--muted)}.export-menu[open]>summary:after{content:"−"}
.export-list-buttons{display:grid;grid-template-columns:1fr;gap:6px;padding:0 8px 8px;max-height:55vh;overflow:auto}
.export-list-buttons button{width:100%;text-align:left;white-space:normal;line-height:1.3;padding:10px 12px;font-size:13px}
.export-category{border-top:1px solid var(--line)}.export-category>summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:750;display:flex;justify-content:space-between;align-items:center}.export-category>summary::-webkit-details-marker{display:none}.export-category>summary:after{content:"＋";color:var(--muted)}.export-category[open]>summary:after{content:"−"}.export-category>.export-list-buttons{padding:0 8px 8px;max-height:none}
.top-downloads{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
</style></head><body>
<header><h1>Sklad</h1></header>
<main>
<div class="top-downloads" aria-label="Stiahnuť Excel súbory">
  <details class="export-menu" id="exportListsMenu"><summary>⬇ Výdajové zoznamy (.xlsx)</summary><div class="export-list-buttons" id="exportListButtons"></div></details>
  <button class="btn secondary" id="exportStockTop" type="button">⬇ Stiahnuť celý sklad (.xlsx)</button>
</div>
<section class="checklists" aria-labelledby="checklistsTitle">

  <p class="section-note">Rozklikni zoznam a zaškrtni položky, ktoré už boli vydané. Stav sa ukladá v tomto prehliadači.</p>
  <div id="checklists"></div>
</section>
<input id="q" type="search" placeholder="Hľadaj názov, materiál alebo pozíciu…" autocomplete="off">
<div class="filters">
<select id="positionFilter"><option value="">Všetky skladové pozície</option></select>
<select id="sort"><option value="relevance">Poradie z Excelu</option><option value="position">Pozícia A–Z</option><option value="material">Materiál 0–9</option><option value="name">Názov A–Z</option></select>
</div>
<div class="status" id="status" aria-live="polite"></div><div id="results"></div>


<div class="tools">
  <label class="filebtn">⬆ Aktualizovať zoznam z Excelu (.xlsx) <input id="xlsxfile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>

<button class="btn secondary" id="reset">Obnoviť základný zoznam</button>
</div>
</main><footer>Vyber skladovú pozíciu v hornej ponuke a zobrazíš všetok materiál uložený na tejto pozícii.</footer>

function makeXlsx(rows){const data=[keys,...rows.map(x=>keys.map(k=>String(x[k]??"")))];const sheetRows=data.map((row,ri)=>`<row r="${ri+1}">${row.map((v,ci)=>`<c r="${excelCol(ci+1)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`).join("")}</row>`).join("");const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`;const files={"[Content_Types].xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,"_rels/.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,"xl/workbook.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sklad" sheetId="1" r:id="rId1"/></sheets></workbook>`,"xl/_rels/workbook.xml.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`,"xl/worksheets/sheet1.xml":sheet};return zipStore(files)}
function makeXlsxTable(headers, rows, sheetName="Zoznam") {
 const data=[headers,...rows];
 const sheetRows=data.map((row,ri)=>`<row r="${ri+1}">${row.map((v,ci)=>`<c r="${excelCol(ci+1)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`).join("")}</row>`).join("");
 const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`;
 const safeName=String(sheetName).slice(0,31).replace(/[\\/?*\[\]:]/g," ")||"Zoznam";
 const files={"[Content_Types].xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`,"_rels/.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,"xl/workbook.xml":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(safeName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,"xl/_rels/workbook.xml.rels":`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`,"xl/worksheets/sheet1.xml":sheet};
 return zipStore(files);
}
function zipStore(files){const chunks=[],central=[];let offset=0;for(const [name,content] of Object.entries(files)){const nb=utf8.encode(name),data=utf8.encode(content),crc=crc32(data),local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...nb,...data]);chunks.push(local);const cd=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nb]);central.push(cd);offset+=local.length}const centralSize=central.reduce((n,c)=>n+c.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(centralSize),...u32(offset),...u16(0)]);return new Blob([...chunks,...central,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
async function saveBlob(blob,filename){if(window.Android&&typeof window.Android.saveFile==="function"){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]||"");r.onerror=reject;r.readAsDataURL(blob)});window.Android.saveFile(filename,blob.type||"application/octet-stream",data);return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$("xlsxfile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const imported=await readXlsx(await f.arrayBuffer());if(!imported.length)throw Error("V Excel súbore sa nenašli žiadne položky.");if(!confirm(`Načítať ${imported.length} položiek z Excelu? Aktuálny zoznam sa nahradí obsahom súboru.`))return;items=imported;positionFilter.innerHTML='<option value="">Všetky skladové pozície</option>';[...new Set(items.map(x=>String(x[keys[0]]??"")).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(pos=>{const o=document.createElement("option");o.value=pos;o.textContent=pos;positionFilter.appendChild(o)});positionFilter.value="";$("q").value="";render();alert("Zoznam aktualizovaný z Excelu. Počet položiek: "+items.length)}catch(err){alert(err.message||"Excel súbor sa nepodarilo načítať.")}e.target.value=""});
async function exportStockFile(){try{const blob=makeXlsx(items);await saveBlob(blob,"cely-sklad.xlsx")}catch(err){alert("Export celého skladu do Excelu sa nepodaril: "+(err.message||"neznáma chyba"))}}
const legacyExportButton=$("exportXlsx");if(legacyExportButton)legacyExportButton.addEventListener("click",exportStockFile);
$("exportStockTop").addEventListener("click",exportStockFile);
function exportFilename(name){return String(name||"zoznam").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"zoznam"}
function renderExportListButtons(){
 const wrap=$("exportListButtons");if(!wrap)return;wrap.innerHTML="";
 const cw=issueLists.filter(list=>/\bCW\b/i.test(list.title));
 const sor=issueLists.filter(list=>/\bSOR\b/i.test(list.title));
 const first=issueLists.filter(list=>/\bFIRST\b/i.test(list.title));
 const liquids=issueLists.filter(list=>list.id==="prevadzkove-kvapliny");
 const lakovanie=issueLists.filter(list=>list.id.startsWith("lakovanie-"));
 const other=issueLists.filter(list=>!(/\bCW\b/i.test(list.title)||/\bSOR\b/i.test(list.title)||/\bFIRST\b/i.test(list.title)||list.id==="prevadzkove-kvapliny"||list.id.startsWith("lakovanie-")));
 const downloadButton=list=>{const b=document.createElement("button");b.type="button";b.className="btn secondary";b.textContent="⬇ "+list.title;b.addEventListener("click",async()=>{try{const rows=list.items.map((item,i)=>[item.position||"",item.material||"",item.description||"",item.quantity||"",issued[list.id+"-"+i]?"Vydané":"Nevydané"]);if(!rows.length)throw Error("Tento zoznam neobsahuje žiadne položky.");const blob=makeXlsxTable(["Skladová pozícia","Číslo materiálu","Popis materiálu","Množstvo","Stav vydania"],rows,list.title);await saveBlob(blob,exportFilename(list.title)+".xlsx")}catch(err){alert("Export zoznamu do Excelu sa nepodaril: "+(err.message||"neznáma chyba"))}});return b};
 const category=(name,id,lists)=>{if(!lists.length)return;const d=document.createElement("details");d.className="export-category";d.dataset.category=id;const summary=document.createElement("summary");summary.textContent=name;d.appendChild(summary);const inner=document.createElement("div");inner.className="export-list-buttons";lists.forEach(list=>inner.appendChild(downloadButton(list)));d.appendChild(inner);wrap.appendChild(d)};
 other.forEach(list=>wrap.appendChild(downloadButton(list)));
 category("PREVÁDZKOVÉ KVAPALINY","category-liquids",liquids);
 category("LAKOVANIE","category-lakovanie",lakovanie);
 category("SOR","category-sor",sor);
 category("CW","category-cw",cw);
 category("FIRST","category-first",first);
}
renderExportListButtons();
render();
</script></body></html>
